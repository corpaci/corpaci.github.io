---
layout: default
---
<article>
  {% unless page.hide_title %}
  <div class="page-header">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}
    <p class="page-subtitle">{{ page.subtitle }}</p>
    {% endif %}
  </div>
  {% endunless %}
  {% if page.epistemic_status %}
  <div class="epistemic-note">
    <span class="epistemic-label">{{ page.epistemic_status }}</span>
    {% if page.epistemic_note %}<span>{{ page.epistemic_note }}</span>{% endif %}
  </div>
  {% endif %}
  {{ content }}
</article>
