# Lenses: three angles on one research program.
#
# These are not audience segments and not difficulty levels — the theme strata
# (day/night/spectrum) already grade depth. A lens is the question a reader
# brings. The same work answers all three, differently.
#
# To add a page to a lens, add a line under `path:`. Nothing else needs editing.

- id: engineer
  name: Engineer
  question: Does the thing I built do what the spec says?
  summary: >-
    Verification is a discipline of scope. A checker earns trust by what it
    refuses to answer as much as by what it decides. The instruments here are
    built to be honestly silent outside a declared fragment.
  reading:
    - url: /blog/verification-validation-boundary
      title: The Verification/Validation Boundary
      why: The seam this whole program sits on. Start here.
    - url: /limits/
      title: Limits — interactive
      why: Walks the walls by hand, ending at the scoped-checker proposal.
    - url: /projects/ictss-playground/
      title: ICTSS Playground
      why: Combinatorial coverage, from the Best Paper work.
    - url: /formalization-limits/
      title: Limits to Formalization
      why: Where a mechanically checked artifact stops supporting its interpretation.

- id: scientist
  name: Scientist
  question: What did you measure, and how could it be wrong?
  summary: >-
    Every claim here is scoped to a setup and reported with what it does not
    show. Where an external checker can settle a question, it settles it;
    where it cannot, the case is pooled into neither rate.
  reading:
    - url: /projects/sair-embedding-geometry/
      title: SAIR Embedding Geometry
      why: The pilot. A 0.383 transfer gap, and the control that is still pending.
    - url: /research/#semantic-faithfulness
      title: Semantic Faithfulness Across Representations
      why: The empirical program, with its failure modes stated.
    - url: /interpretability-grounding/
      title: Interpretability and Grounding
      why: Why a reported feature is a property of the measurement setup.
    - url: /projects/bias-measurement/
      title: Social Bias Measurement
      why: Descriptive geometry, and the normative choices it does not remove.

- id: philosopher
  name: Philosopher
  question: What is it for a symbol to mean what we meant?
  summary: >-
    Tarski, Gödel, and Chaitin are the recurring reference points. The
    interesting move is not that formal systems have limits — it is what a
    system should do when it reaches one.
  reading:
    - url: /blog/limits-of-formalization
      title: The Limits of Formalization for AI Safety
      why: The long argument, from Plato to the scoped-checker proposal.
    - url: /map/
      title: Self-Reference Map
      why: 24 examples arranged by chosen features. Similarity is not equivalence.
    - url: /blog/good-feels-like
      title: How Does Good Feel Like
      why: On what a value would have to be for a formalism to hold it.
    - url: /blog/good-formalisms-for-good
      title: Good Formalisms for Good
      why: Whether the tool can carry the thing it was built to protect.
